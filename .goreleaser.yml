---
version: 2

before:
  hooks:
    - "go mod tidy"

builds:
  - id: "tgdash"
    main: "."
    binary: "tgdash"
    env:
      - "CGO_ENABLED=0"
    goos:
      - "linux"
      - "darwin"
    goarch:
      - "amd64"
      - "arm64"
    ldflags:
      - "-s -w"

archives:
  - id: "default"
    formats:
      - "tar.gz"
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - "README.md"
      - "LICENSE"
      - "doc/tgdash.1"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: "asc"
  groups:
    - title: "Features"
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: "Refactoring"
      regexp: '^refactor(\(.+\))?:'
      order: 2
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: "garbas"
    name: "tgdash"
  draft: false
  prerelease: "auto"
  mode: "append"
  name_template: "v{{.Version}}"
