---
name: "CI"

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: "read"

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Set up Go"
        uses: "actions/setup-go@v5"
        with:
          go-version-file: "go.mod"

      - name: "Vet"
        run: "go vet ./..."

      - name: "Format check"
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

      - name: "Build"
        run: "go build -o tgdash ."

      - name: "Test"
        run: "go test ./... -v -count=1 -race"

  pre-commit:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install Nix"
        uses: "cachix/install-nix-action@v30"

      - name: "Run pre-commit checks"
        run: "nix flake check"

  nix-build:
    runs-on: "ubuntu-latest"
    needs: ["test", "pre-commit"]
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install Nix"
        uses: "cachix/install-nix-action@v30"

      - name: "Build"
        run: "nix build .#tgdash"
